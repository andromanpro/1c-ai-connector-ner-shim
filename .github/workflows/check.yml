name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked-environment tool
        run: python -m pip install uv==0.13.5
      - name: Install locked runtime
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Recognition and HTTP protocol tests
        run: uv run --frozen python test_shim.py
      - name: Mutation controls
        run: uv run --frozen python mutants_shim.py
      - name: No obsolete setuptools runtime
        run: uv run --frozen python -c "import importlib.util; assert importlib.util.find_spec('pkg_resources') is None; assert importlib.util.find_spec('setuptools') is None"
